  - N_AIH
  - CPF_AUT
  - NOME_PAC

datasus_sia:
  - AP_NASC
  - AP_AUTORIZ
  - AP_CNSPACS
  - AP_CPF_AUT
  - AP_CPF_SOL
  - AP_PROF
  - PA_AUTORIZ
  - PA_CNSMED
  - PA_NASC
  - NOME_PAC

datasus_cnes:
  - CPF_PROF
  - NOME_PROF

datasus_sinan:
  - DT_NASC
  - NU_NOTIFIC
  - NM_PACIENT
  - CPF_PAC
  - ID_CNS_SUS
  - NUM_SUS
  - NM_MAE_PAC
